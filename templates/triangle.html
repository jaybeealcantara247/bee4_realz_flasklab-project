<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Area of Triangle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'navbar.html' %}
    
    <div style="margin: 20px; font-family: Arial, sans-serif;">
        <h1>Calculate Area of a Triangle</h1>
        
        <form method="POST">
            <label for="base">Base:</label><br>
            <input type="number" step="any" name="base" id="base" required style="padding: 5px; margin: 5px 0;"><br>
            
            <label for="height">Height:</label><br>
            <input type="number" step="any" name="height" id="height" required style="padding: 5px; margin: 5px 0;"><br>
            
            <button type="submit" style="padding: 8px 15px; margin-top: 5px; background-color: #655439; color: white; border: none; border-radius: 4px; cursor: pointer;">Calculate</button>
        </form>

        {% if result is not none %}
            <h3 style="margin-top: 20px; color: #333;">Result: {{ result }}</h3>
        {% endif %}
    </div>
</body>
</html>
