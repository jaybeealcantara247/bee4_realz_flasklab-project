{% extends 'base.html' %}

{% block title %}Triangle Area - BEE4_REALZ{% endblock %}

{% block content %}
<div class="subpage-card grunge-profile">
  <h2>CALCULATE AREA OF A TRIANGLE</h2>
  
  <form method="POST" style="margin-top: 20px;">
    <div style="margin-bottom: 15px;">
      <label for="base" style="display: block; color: #999; margin-bottom: 5px; font-weight: bold;">BASE:</label>
      <input type="number" step="any" id="base" name="base" required style="padding: 10px; width: 100%; background: rgba(255, 255, 255, 0.1); border: 1px solid #444; color: #fff; border-radius: 5px;">
    </div>
    <div style="margin-bottom: 20px;">
      <label for="height" style="display: block; color: #999; margin-bottom: 5px; font-weight: bold;">HEIGHT:</label>
      <input type="number" step="any" id="height" name="height" required style="padding: 10px; width: 100%; background: rgba(255, 255, 255, 0.1); border: 1px solid #444; color: #fff; border-radius: 5px;">
    </div>
    <button type="submit" class="pill-btn" style="width: 100%;">Calculate</button>
  </form>

  {% if area is not none %}
    <div class="motto-box" style="margin-top: 25px;">
      <span class="motto-title">RESULT:</span>
      <p class="motto-text">Area = {{ area }}</p>
    </div>
  {% endif %}
</div>
{% endblock %}
